name: Deploy preschools
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preschool-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.DEPLOY_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npm --prefix frontend run build
        env:
          VITE_POCKETBASE_URL: https://clc-preschools.pockethost.io
      - name: Configure SSH
        env:
          SG_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          PH_KEY: ${{ secrets.POCKETHOST_SSH_KEY }}
          SG_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_PASSPHRASE }}
          PH_PASSPHRASE: ${{ secrets.POCKETHOST_SSH_PASSPHRASE }}
          HOST_KEYS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SG_KEY" > ~/.ssh/siteground
          printf '%s\n' "$PH_KEY" > ~/.ssh/pockethost
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/*
          eval "$(ssh-agent -s)"
          printf '%s\n' "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/ssh-askpass" <<'SH'
          #!/bin/sh
          printf '%s\n' "$KEY_PASSPHRASE"
          SH
          chmod 700 "$RUNNER_TEMP/ssh-askpass"
          export SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          KEY_PASSPHRASE="$SG_PASSPHRASE" ssh-add ~/.ssh/siteground < /dev/null
          KEY_PASSPHRASE="$PH_PASSPHRASE" ssh-add ~/.ssh/pockethost < /dev/null
          rm "$RUNNER_TEMP/ssh-askpass"
      - name: Upload backend code
        env:
          PH_USER: ${{ secrets.POCKETHOST_USER }}
        run: |
          printf '%s\n' 'put -r pb_hooks /clc-preschools/' 'put -r pb_migrations /clc-preschools/' > /tmp/backend.sftp
          sftp -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/pockethost -P 2222 -b /tmp/backend.sftp "$PH_USER@ftp.pockethost.io"
      - name: Upload frontend to four subdomains
        env:
          SG_HOST: ${{ secrets.SITEGROUND_HOST }}
          SG_USER: ${{ secrets.SITEGROUND_USER }}
          SG_PORT: ${{ vars.SITEGROUND_PORT || '18765' }}
          SG_ROOT: ${{ vars.SITEGROUND_ROOT }}
        run: |
          python3 - <<'PY'
          import os
          root=os.environ['SG_ROOT'].rstrip('/')
          if not root or '\n' in root or '"' in root:
              raise SystemExit('Set SITEGROUND_ROOT to the verified absolute folder containing your subdomain folders')
          with open('/tmp/cache-read.sftp','w') as f:
              for domain in ['preschool','lba-bf','lba-fl','tle-ec']:
                  target=f'{root}/{domain}.cliffslunchclub.com/public_html'
                  f.write(f'-get "{target}/.htaccess" "/tmp/{domain}.htaccess"\n')
          PY
          sftp -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/siteground -P "$SG_PORT" -b /tmp/cache-read.sftp "$SG_USER@$SG_HOST"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root=os.environ['SG_ROOT'].rstrip('/')
          policy=Path('frontend/deploy/cache-headers.htaccess').read_text()
          with open('/tmp/frontend.sftp','w') as f:
              for domain in ['preschool','lba-bf','lba-fl','tle-ec']:
                  target=f'{root}/{domain}.cliffslunchclub.com/public_html'
                  f.write(f'put -r frontend/dist/assets "{target}/"\n')
                  existing=Path(f'/tmp/{domain}.htaccess')
                  contents=existing.read_text() if existing.exists() else ''
                  contents=re.sub(r'(?ms)^# BEGIN CLC PRESCHOOL CACHE POLICY\n.*?^# END CLC PRESCHOOL CACHE POLICY\n?', '', contents)
                  existing.write_text(contents.rstrip() + '\n\n' + policy)
                  f.write(f'put "/tmp/{domain}.htaccess" "{target}/.htaccess"\n')
                  f.write(f'put frontend/dist/index.html "{target}/index.html"\n')
          PY
          sftp -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/siteground -P "$SG_PORT" -b /tmp/frontend.sftp "$SG_USER@$SG_HOST"
